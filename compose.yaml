services:
  ml:
    build:
      context: ./ml
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ORS_API_KEY: ${ORS_API_KEY:-}
      ALGORITHM_URL: http://ml:8000
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      ml:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "5173:80"
